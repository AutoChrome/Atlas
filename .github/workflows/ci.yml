name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
          # Test-only values, not real secrets — Webhook#secret (encrypts
          # :secret) needs these configured or fixture loading and any test
          # touching a Webhook raises a missing-encryption-key error.
          AR_ENCRYPTION_PRIMARY_KEY: WW1AeDRUf17rSVsMlZsKs8blTOqTIYk4
          AR_ENCRYPTION_DETERMINISTIC_KEY: MMfkqhmh775hoEtddlYArzqcr92CsD50
          AR_ENCRYPTION_KEY_DERIVATION_SALT: TDbwWTvnfjmiKipg8Y6uxFldtaUWqoS1
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
          # Test-only values, not real secrets — see the "test" job above.
          AR_ENCRYPTION_PRIMARY_KEY: WW1AeDRUf17rSVsMlZsKs8blTOqTIYk4
          AR_ENCRYPTION_DETERMINISTIC_KEY: MMfkqhmh775hoEtddlYArzqcr92CsD50
          AR_ENCRYPTION_KEY_DERIVATION_SALT: TDbwWTvnfjmiKipg8Y6uxFldtaUWqoS1
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Runs only after every check above has passed, and only for a real push
  # to main (never for a pull request) — see README's "Production
  # deployment (CI/CD)" section for how the self-hosted runner this targets
  # gets set up, and what has to already be sitting on that server (a
  # filled-in .env, Docker + the Compose plugin) before the first deploy
  # can succeed.
  deploy:
    needs: [scan_ruby, scan_js, lint, test, system-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, production]
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # .env lives untracked in this same directory, filled in by hand
          # once on the server — the default `clean: true` would otherwise
          # delete it before every single deploy.
          clean: false

      # Also precompiles assets: the Dockerfile runs `assets:precompile` as
      # part of the image build itself (see Dockerfile), so there's no
      # separate step for that below — it either happens here, as part of
      # this build, or the build fails and nothing after this step runs.
      - name: Build the production images
        run: docker compose -f docker-compose.prod.yml build web worker

      # db:prepare, not db:migrate — creates the database(s) too, so this
      # works identically for the very first deploy and every one after.
      - name: Run database migrations
        run: docker compose -f docker-compose.prod.yml run --rm web bin/rails db:prepare

      - name: Deploy the new images
        run: docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Remove now-unused images
        run: docker image prune -f
