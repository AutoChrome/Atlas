name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      # Backs search (searchkick) — Area/Page/Chart/Tutorial all reindex on
      # save, so without this every test that creates one of those fails
      # with a connection-refused to the default localhost:9200 instead of
      # exercising the model logic being tested.
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
          # The security plugin's demo-config installer demands this before
          # it even gets to plugins.security.disabled above — CI-only
          # throwaway container, not a real credential.
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Atlas_search_ci1"
        ports:
          - 9200:9200
        options: --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1" --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
          OPENSEARCH_URL: http://localhost:9200
          # Test-only values, not real secrets — Webhook#secret (encrypts
          # :secret) needs these configured or fixture loading and any test
          # touching a Webhook raises a missing-encryption-key error.
          AR_ENCRYPTION_PRIMARY_KEY: WW1AeDRUf17rSVsMlZsKs8blTOqTIYk4
          AR_ENCRYPTION_DETERMINISTIC_KEY: MMfkqhmh775hoEtddlYArzqcr92CsD50
          AR_ENCRYPTION_KEY_DERIVATION_SALT: TDbwWTvnfjmiKipg8Y6uxFldtaUWqoS1
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      # See the "test" job above — searchkick reindexes on save.
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
          # The security plugin's demo-config installer demands this before
          # it even gets to plugins.security.disabled above — CI-only
          # throwaway container, not a real credential.
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Atlas_search_ci1"
        ports:
          - 9200:9200
        options: --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1" --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
          OPENSEARCH_URL: http://localhost:9200
          # Test-only values, not real secrets — see the "test" job above.
          AR_ENCRYPTION_PRIMARY_KEY: WW1AeDRUf17rSVsMlZsKs8blTOqTIYk4
          AR_ENCRYPTION_DETERMINISTIC_KEY: MMfkqhmh775hoEtddlYArzqcr92CsD50
          AR_ENCRYPTION_KEY_DERIVATION_SALT: TDbwWTvnfjmiKipg8Y6uxFldtaUWqoS1
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
